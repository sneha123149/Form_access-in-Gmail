<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <title>Contact Form</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Fullscreen background video */
    #bgvideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* Dark overlay to enhance readability */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    /* Glass-style form card */
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      color: white;
    }

    label, .form-control, .card-title {
      color: white;
    }

    input[type="radio"] {
      margin-right: 5px;
    }

    #result {
      min-height: 20px;
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="bgvideo">
    <source src="video.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Contact Form</h3>
            <form id="form">
              <input type="hidden" name="access_key" value="aebcf9c9-be58-4668-b1b2-7addf6bdafae">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your Name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Contact</label>
                <input type="text" name="contact" class="form-control" placeholder="Enter your Contact" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your Email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control" placeholder="Enter your Age" required>
              </div>
              <div class="mb-3">
                <label class="form-label d-block">Gender</label>
                <label><input type="radio" name="gender" value="MALE" required> Male</label>
                <label class="ms-3"><input type="radio" name="gender" value="FEMALE"> Female</label>
              </div>
              <div class="d-grid">
                <button type="button" onclick="submitForm()" class="btn btn-primary">Submit</button>
              </div>
              <div id="result" class="mt-3 text-center text-white fw-bold"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function submitForm() {
      const form = document.getElementById('form');
      const result = document.getElementById('result');
      result.innerHTML = "Please wait...";
      result.style.display = 'block';
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => data[key] = value);

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(data => result.innerHTML = data.message)
      .catch(() => result.innerHTML = "Something went wrong!");

      form.reset();
      setTimeout(() => {
        result.style.display = "none";
      }, 3000);
    }
  </script>
</body>
</html>
